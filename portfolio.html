<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>作品集 · Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    @property --pointer-x {
      syntax: "<percentage>";
      inherits: true;
      initial-value: 50%;
    }
    @property --pointer-y {
      syntax: "<percentage>";
      inherits: true;
      initial-value: 50%;
    }
    @property --background-x {
      syntax: "<percentage>";
      inherits: true;
      initial-value: 50%;
    }
    @property --background-y {
      syntax: "<percentage>";
      inherits: true;
      initial-value: 50%;
    }

    :root {
      --ink: #eef6f8;
      --ink-dim: #8aa4ae;
      --void: #050b10;
      --brass: #e0b87a;
      --teal: #3ad8c8;
      --font-display: "Instrument Serif", Georgia, serif;
      --font-body: "Manrope", sans-serif;
      --mx: 50%;
      --my: 38%;
      --mxn: 0.5;
      --myn: 0.38;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-body);
      color: var(--ink);
      min-height: 100vh;
      line-height: 1.5;
      background: var(--void);
      overflow-x: hidden;
    }

    /* Custom foil cursor — fine pointer only */
    @media (hover: hover) and (pointer: fine) {
      html.foil-cursor,
      html.foil-cursor * {
        cursor: none !important;
      }
    }

    .foil-pointer {
      position: fixed;
      left: 0;
      top: 0;
      width: 44px;
      height: 44px;
      z-index: 400;
      pointer-events: none;
      opacity: 0;
      mix-blend-mode: plus-lighter;
      transform: translate3d(-100px, -100px, 0);
      transition: opacity 0.25s ease;
    }

    html.foil-cursor .foil-pointer.is-on { opacity: 1; }

    .foil-pointer-ring,
    .foil-pointer-core,
    .foil-pointer-spark {
      position: absolute;
      left: 50%;
      top: 50%;
      translate: -50% -50%;
    }

    .foil-pointer-ring {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(224, 184, 122, 0.55);
      box-shadow:
        0 0 0 1px rgba(58, 216, 200, 0.18),
        0 0 18px rgba(58, 216, 200, 0.22),
        inset 0 0 10px rgba(255, 255, 255, 0.12);
      background:
        conic-gradient(from 40deg, rgba(224,184,122,0.0), rgba(58,216,200,0.35), rgba(224,184,122,0.55), rgba(255,255,255,0.15), rgba(58,216,200,0.0));
      -webkit-mask: radial-gradient(circle, transparent 57%, #000 58%);
      mask: radial-gradient(circle, transparent 57%, #000 58%);
      transition: width 0.28s cubic-bezier(0.22, 1, 0.36, 1), height 0.28s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.2s;
    }

    .foil-pointer-core {
      width: 9px;
      height: 9px;
      rotate: 45deg;
      border-radius: 1.5px;
      background:
        linear-gradient(135deg, #fff8e8 0%, #e0b87a 38%, #3ad8c8 72%, #fff 100%);
      box-shadow:
        0 0 10px rgba(224, 184, 122, 0.7),
        0 0 16px rgba(58, 216, 200, 0.35);
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), width 0.22s, height 0.22s;
    }

    .foil-pointer-spark {
      width: 2px;
      height: 10px;
      border-radius: 2px;
      background: linear-gradient(#fff, rgba(58, 216, 200, 0));
      opacity: 0.7;
      translate: -50% calc(-50% - 16px);
    }

    .foil-pointer.is-hover .foil-pointer-ring {
      width: 52px;
      height: 52px;
      border-color: rgba(58, 216, 200, 0.7);
    }

    .foil-pointer.is-hover .foil-pointer-core {
      width: 7px;
      height: 7px;
      transform: scale(0.86);
    }

    .foil-pointer.is-down .foil-pointer-ring {
      width: 28px;
      height: 28px;
    }

    .foil-pointer.is-down .foil-pointer-core {
      transform: scale(0.7);
    }

    @media (hover: none), (pointer: coarse) {
      .foil-pointer { display: none; }
    }

    .stage-light {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(520px 400px at var(--mx) var(--my), rgba(255, 248, 230, 0.11), transparent 55%),
        radial-gradient(700px 520px at var(--mx) var(--my), rgba(58, 216, 200, 0.12), transparent 58%),
        radial-gradient(ellipse 100% 70% at 50% -10%, rgba(70, 120, 145, 0.24), transparent 55%),
        radial-gradient(ellipse 70% 45% at 100% 100%, rgba(12, 70, 78, 0.28), transparent 50%),
        linear-gradient(185deg, #0b1620 0%, #061018 45%, #04090e 100%);
    }

    .stage-bloom {
      position: fixed;
      width: 40vmin;
      height: 40vmin;
      left: var(--mx);
      top: var(--my);
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(circle, rgba(255, 250, 235, 0.13) 0%, rgba(58, 216, 200, 0.07) 40%, transparent 70%);
      filter: blur(10px);
      mix-blend-mode: screen;
    }

    .stage-vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background: radial-gradient(ellipse 72% 62% at 50% 42%, transparent 42%, rgba(0, 0, 0, 0.52) 100%);
    }

    .stage-grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0.26;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/%3E%3C/svg%3E");
    }

    .wrap {
      position: relative;
      z-index: 2;
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 28px 88px;
    }

    /* —— Hero —— */
    .hero {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 56px 0 80px;
      position: relative;
    }

    .hero-plane {
      position: absolute;
      inset: -6% -12vw 12% -12vw;
      overflow: hidden;
      z-index: 0;
      animation: plane-in 1.2s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .hero-plane-inner {
      width: 100%;
      height: 100%;
      background:
        radial-gradient(ellipse 55% 70% at calc(var(--mxn) * 100%) calc(var(--myn) * 100%), rgba(255, 246, 220, 0.2), transparent 55%),
        radial-gradient(ellipse 50% 55% at 82% 28%, rgba(58, 216, 200, 0.34), transparent 50%),
        radial-gradient(ellipse 45% 50% at 18% 72%, rgba(224, 184, 122, 0.26), transparent 48%),
        linear-gradient(125deg, rgba(4, 10, 14, 0.35) 0%, transparent 45%),
        linear-gradient(165deg, #245264 0%, #123040 40%, #0a1a24 72%, #071018 100%);
    }

    .hero-plane-inner::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(118deg, rgba(255,255,255,0.028) 0 1px, transparent 1px 10px);
      opacity: 0.55;
      mix-blend-mode: soft-light;
    }

    .hero-plane-shine {
      position: absolute;
      inset: -10%;
      background: conic-gradient(
        from calc(200deg + var(--mxn) * 80deg) at calc(var(--mxn) * 100%) calc(var(--myn) * 100%),
        transparent 0deg,
        rgba(255, 255, 255, 0.06) 50deg,
        rgba(58, 216, 200, 0.16) 90deg,
        rgba(224, 184, 122, 0.14) 130deg,
        transparent 180deg,
        transparent 360deg
      );
      mix-blend-mode: screen;
      animation: hero-sweep 10s ease-in-out infinite;
      pointer-events: none;
    }

    .hero-plane::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to top, var(--void) 0%, transparent 42%),
        linear-gradient(90deg, rgba(5, 11, 16, 0.45) 0%, transparent 35%);
    }

    .hero-copy {
      position: relative;
      z-index: 1;
      max-width: 16em;
      animation: rise 0.95s 0.1s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .brand {
      font-family: var(--font-display);
      font-size: clamp(4.2rem, 14vw, 8.2rem);
      line-height: 0.86;
      letter-spacing: -0.035em;
      margin-bottom: 26px;
      background: linear-gradient(125deg, #fffef8 0%, #f0d9a8 18%, #fff 34%, #7be8dc 50%, #fff8e8 66%, var(--brass) 84%, #fff 100%);
      background-size: 220% 220%;
      background-position: calc(var(--mxn) * 100%) calc(var(--myn) * 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 14px 40px rgba(0, 0, 0, 0.55)) drop-shadow(0 0 28px rgba(58, 216, 200, 0.18));
    }

    .hero-copy h1 {
      font-family: var(--font-display);
      font-size: clamp(1.4rem, 2.9vw, 1.85rem);
      font-weight: 400;
      font-style: italic;
      margin-bottom: 12px;
      background: linear-gradient(100deg, #f8fcfd 0%, #d7ebe8 55%, #e0b87a 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 2px 14px rgba(0, 0, 0, 0.4));
    }

    .hero-copy > p {
      color: var(--ink-dim);
      font-size: 1.02rem;
      max-width: 28ch;
      margin-bottom: 30px;
      line-height: 1.55;
    }

    .cta-row {
      animation: rise 0.95s 0.22s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .btn {
      --bx: 50%;
      --by: 50%;
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 24px;
      font-family: var(--font-body);
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      border: none;
      cursor: pointer;
      text-decoration: none;
      overflow: hidden;
      isolation: isolate;
      color: #031412;
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .btn::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(120px 80px at var(--bx) var(--by), rgba(255, 255, 255, 0.42), transparent 55%),
        linear-gradient(160deg, #5aefe0 0%, #2ec4b6 30%, #128a80 100%);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.48),
        inset 0 -3px 10px rgba(0, 0, 0, 0.25),
        0 12px 30px rgba(15, 100, 90, 0.32);
    }

    .btn::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(108deg, transparent 35%, rgba(255,255,255,0.32) 50%, transparent 65%);
      background-size: 220% 100%;
      background-position: 120% 0;
      transition: background-position 0.55s ease;
    }

    .btn:hover { transform: translateY(-2px); }
    .btn:hover::after { background-position: -20% 0; }
    .btn .arrow { transition: transform 0.25s; }
    .btn:hover .arrow { transform: translateX(3px); }

    /* —— Section —— */
    .section { padding-top: 8px; }

    .section-head {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 32px;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: linear-gradient(90deg, rgba(58, 216, 200, 0.05), transparent 42%);
    }

    .section-title { display: flex; flex-direction: column; gap: 6px; }

    .section-title .eyebrow {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--brass);
    }

    .section-title h2 {
      font-family: var(--font-display);
      font-size: clamp(1.85rem, 3.6vw, 2.4rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      color: #f5fafb;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 4px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
    }

    .filter {
      --fx: 50%;
      --fy: 50%;
      padding: 8px 14px;
      font-family: var(--font-body);
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--ink-dim);
      cursor: pointer;
      border: none;
      background: transparent;
      transition: color 0.2s, background 0.2s, box-shadow 0.2s;
    }

    .filter:hover { color: var(--ink); }
    .filter.active {
      color: #041512;
      background:
        radial-gradient(70px 40px at var(--fx) var(--fy), rgba(255, 255, 255, 0.35), transparent 60%),
        linear-gradient(160deg, #5aefe0, #2aa89c);
      box-shadow: 0 4px 16px rgba(42, 168, 156, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 36px 24px;
      perspective: 1400px;
    }

    /* —— Cards —— */
    .card-slot {
      perspective: 1100px;
      opacity: 0;
      animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .card {
      --pointer-x: 50%;
      --pointer-y: 50%;
      --pointer-from-center: 0;
      --pointer-from-top: 0.5;
      --pointer-from-left: 0.5;
      --background-x: 50%;
      --background-y: 50%;
      --card-opacity: 0;
      --rx: 0deg;
      --ry: 0deg;
      --sx: 0px;
      --sy: 20px;
      --scale: 1;
      --holo-red: #f80e35;
      --holo-yellow: #eedf10;
      --holo-green: #21e985;
      --holo-blue: #0dbde9;
      --holo-violet: #c929f1;
      --card-glow: hsl(175, 100%, 90%);
      position: relative;
      width: 100%;
      aspect-ratio: 63 / 88;
      border: none;
      padding: 0;
      cursor: pointer;
      font-family: inherit;
      color: inherit;
      background: transparent;
      transform-style: preserve-3d;
      transform: rotateX(var(--rx)) rotateY(var(--ry)) scale(var(--scale));
      transition: none;
      border-radius: 18px;
      will-change: transform;
      filter: drop-shadow(var(--sx) var(--sy) 26px rgba(0, 0, 0, 0.55));
      animation: card-idle 6.5s ease-in-out infinite;
    }

    .card-slot:nth-child(2n) .card { animation-delay: -1.4s; }
    .card-slot:nth-child(3n) .card { animation-delay: -2.8s; }
    .card.active,
    .card.settling { animation: none; }

    .card:focus-visible {
      outline: 2px solid var(--teal);
      outline-offset: 8px;
    }

    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 18px;
      overflow: hidden;
      background:
        radial-gradient(140% 90% at var(--pointer-x) var(--pointer-y), rgba(255, 255, 255, 0.14), transparent 45%),
        linear-gradient(165deg, #334858 0%, #1a2834 28%, #0e161e 65%, #172430 100%);
      box-shadow:
        inset 0 1.5px 0 rgba(255, 255, 255, 0.28),
        inset 0 -3px 14px rgba(0, 0, 0, 0.5),
        inset 0 0 0 1px rgba(255, 255, 255, 0.12);
    }

    .card.active .card-face {
      box-shadow:
        inset 0 1.5px 0 rgba(255, 255, 255, 0.34),
        inset 0 -3px 14px rgba(0, 0, 0, 0.45),
        inset 0 0 0 1px rgba(255, 255, 255, 0.18),
        0 0 0 1px hsla(47, 100%, 78%, calc(var(--card-opacity) * 0.55)),
        0 0 28px color-mix(in srgb, var(--card-glow) calc(var(--card-opacity) * 45%), transparent);
    }

    .card-bezel {
      position: absolute;
      inset: 7px;
      border-radius: 13px;
      pointer-events: none;
      z-index: 1;
      border: 1.5px solid transparent;
      background: linear-gradient(
        calc(120deg + var(--pointer-from-left) * 40deg),
        rgba(255, 255, 255, 0.55),
        rgba(224, 184, 122, 0.75) 35%,
        rgba(58, 216, 200, 0.6) 65%,
        rgba(255, 255, 255, 0.25)
      ) border-box;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      padding: 1.5px;
      opacity: calc(0.55 + var(--card-opacity) * 0.45);
    }

    .card-head {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-type {
      padding: 3px 9px;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #1a1208;
      background: linear-gradient(180deg, #f3e0b4 0%, #d4a574 48%, #b8844a 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.55), inset 0 -1px 0 rgba(0,0,0,0.25), 0 2px 8px rgba(0,0,0,0.35);
    }

    .card-foil-tag {
      padding: 3px 8px;
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #d8f8f4;
      background: rgba(8, 28, 32, 0.72);
      border: 1px solid rgba(58, 216, 200, 0.35);
      backdrop-filter: blur(6px);
    }

    .card-art {
      position: absolute;
      top: 40px;
      left: 14px;
      right: 14px;
      bottom: 72px;
      border-radius: 8px;
      overflow: hidden;
      z-index: 2;
      background: var(--art, linear-gradient(145deg, #1e3a4a, #0f2028));
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.16),
        inset 0 14px 30px rgba(255, 255, 255, 0.07),
        inset 0 -18px 36px rgba(0, 0, 0, 0.4),
        0 6px 16px rgba(0, 0, 0, 0.4);
    }

    .card-art::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        120deg,
        rgba(255, 255, 255, calc(0.16 + var(--card-opacity) * 0.22)) 0%,
        transparent 32%,
        transparent 62%,
        rgba(0, 0, 0, 0.22) 100%
      );
      mix-blend-mode: soft-light;
      pointer-events: none;
      z-index: 1;
    }

    .card-art img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      display: block;
      transform: scale(1.03);
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .card.active .card-art img {
      transform: scale(1.07);
    }

    .card[data-type="html"] .card-art img,
    .card[data-type="pdf"] .card-art img {
      object-position: center top;
    }

    .card[data-type="video"] .card-art img {
      object-position: center 40%;
    }

    .card-art .glyph {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      font-family: var(--font-display);
      font-size: clamp(2rem, 8vw, 2.6rem);
      font-style: italic;
      color: rgba(255, 255, 255, 0.3);
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.45);
    }

    .card-plate {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      height: 52px;
      z-index: 2;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: left;
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.1) 0%, transparent 40%),
        linear-gradient(165deg, #2a3c4a 0%, #152028 55%, #0f1820 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), inset 0 -1px 0 rgba(0,0,0,0.35), 0 4px 12px rgba(0,0,0,0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .card-plate h3 {
      font-size: 1.02rem;
      font-weight: 600;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
    }

    .card-plate .sub {
      margin-top: 2px;
      font-size: 0.7rem;
      color: rgba(180, 200, 208, 0.85);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* —— Base shine (regular) —— */
    .card-shine {
      --scanlines-space: 1px;
      --scanlines-light: #666;
      --scanlines-dark: #000;
      --bars: 3%;
      --bar-color: hsla(0, 0%, 70%, 1);
      --bar-bg: hsla(0, 0%, 0%, 1);
      --space: 4%;
      --barwidth: 1.2%;
      position: absolute;
      top: 40px;
      left: 14px;
      right: 14px;
      bottom: 72px;
      border-radius: 8px;
      pointer-events: none;
      z-index: 3;
      overflow: hidden;
      display: grid;
      opacity: var(--card-opacity);
      mix-blend-mode: color-dodge;
      filter: brightness(1.1) contrast(1.15) saturate(1.25);
      background-image:
        repeating-linear-gradient(
          110deg,
          var(--holo-violet), var(--holo-blue), var(--holo-green), var(--holo-yellow), var(--holo-red),
          var(--holo-violet), var(--holo-blue), var(--holo-green), var(--holo-yellow), var(--holo-red),
          var(--holo-violet), var(--holo-blue), var(--holo-green), var(--holo-yellow), var(--holo-red)

        calc(((50% - var(--background-x)) * 2.6) + 50%) calc(((50% - var(--background-y)) * 3.5) + 50%),

      background-blend-mode: overlay;
      will-change: background-position, opacity, filter;
    }

    .card-shine::before {
      content: "";
      grid-area: 1 / 1;
      background-image:
        repeating-linear-gradient(
          90deg,
          var(--bar-bg) calc(var(--bars) * 2),
          var(--bar-color) calc(var(--bars) * 3),
          var(--bar-bg) calc(var(--bars) * 3.5),

          var(--bar-color) calc(var(--bars) * 4),
          var(--bar-bg) calc(var(--bars) * 5),
          var(--bar-bg) calc(var(--bars) * 10)

      background-position:
        calc((((50% - var(--background-x)) * 1.65) + 50%) + (var(--background-y) * 0.5)) var(--background-x),
        calc((((50% - var(--background-x)) * -0.9) + 50%) - (var(--background-y) * 0.75)) var(--background-y);

    }

    .card-shine::after {
      content: "";

      background-image: radial-gradient(
        farthest-corner circle at var(--pointer-x) var(--pointer-y),

      mix-blend-mode: luminosity;
      filter: brightness(0.6) contrast(4);
    }

    .card-glare {
      position: absolute;
      top: 40px;
      left: 14px;
      right: 14px;
      bottom: 72px;
      border-radius: 8px;
      pointer-events: none;
      z-index: 4;
      opacity: calc(var(--card-opacity) * 0.85);
      filter: brightness(0.85) contrast(1.55);
      mix-blend-mode: overlay;
      background-image: radial-gradient(
        farthest-corner circle at var(--pointer-x) var(--pointer-y),

        hsla(0, 0%, 100%, 0.55) 20%,
        hsla(0, 0%, 0%, 0.45) 90%
      );
    }

    .card-glare::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(
        farthest-corner circle at var(--pointer-x) var(--pointer-y),
        hsla(0, 0%, 100%, 0.5) 0%,
        hsla(180, 40%, 80%, 0.12) 28%,
        transparent 55%
      );
      mix-blend-mode: soft-light;
      opacity: calc(0.35 + var(--pointer-from-center) * 0.65);
    }

    /* Rainbow preset */
    .card[data-foil="rainbow"] { --card-glow: hsl(280, 80%, 75%); }
    .card[data-foil="rainbow"] .card-shine {
      --r1: hsl(0, 57%, 42%);
      --r2: hsl(40, 53%, 44%);
      --r3: hsl(90, 60%, 40%);
      --r4: hsl(180, 60%, 40%);
      --r5: hsl(210, 57%, 44%);
      --r6: hsl(280, 55%, 40%);
      background-image:
        linear-gradient(-45deg, var(--r1), var(--r4)),
        radial-gradient(1px 1px at 20% 30%, #fff8, transparent),
        radial-gradient(1px 1px at 70% 60%, #fff6, transparent),
        radial-gradient(1.2px 1.2px at 40% 80%, #ffe8, transparent),
        linear-gradient(-30deg, var(--r1), var(--r2), var(--r3), var(--r4), var(--r5), var(--r6), var(--r1), var(--r2), var(--r3), var(--r4), var(--r5), var(--r6), var(--r1));
      background-size: 200% 200%, 18% 18%, 22% 22%, 16% 16%, 400% 400%;
      background-position:
        calc(25% + 50% * var(--pointer-from-left)) calc(25% + 50% * var(--pointer-from-top)),
        center, center, center,
        calc(25% + var(--pointer-x) / 2) calc(25% + var(--pointer-y) / 2);
      background-blend-mode: luminosity, soft-light, soft-light, soft-light, normal;
      filter: brightness(calc(var(--pointer-from-center) * 0.25 + 0.65)) contrast(2.15) saturate(0.85);
      mix-blend-mode: color-dodge;
    }
    .card[data-foil="rainbow"] .card-shine::before {
      background-image: radial-gradient(circle at 30% 20%, #fff3, transparent 40%), radial-gradient(circle at 70% 70%, #8cf5, transparent 35%);
      background-size: cover;
      background-position: center;
      filter: brightness(1.4) contrast(1.1);
      mix-blend-mode: soft-light;
      opacity: calc((var(--pointer-from-center) + 0.35) * 0.7);
    }
    .card[data-foil="rainbow"] .card-shine::after {
      background-image:
        radial-gradient(1px 1px at 25% 40%, #fff, transparent),
        radial-gradient(1px 1px at 65% 25%, #ffe, transparent),
        linear-gradient(-60deg, var(--r1), var(--r2), var(--r3), var(--r4), var(--r5), var(--r6), var(--r1), var(--r2), var(--r3), var(--r4), var(--r5), var(--r6), var(--r1));
      background-size: 20% 20%, 24% 24%, 400% 400%;
      background-position: center, center, var(--pointer-x) var(--pointer-y);
      filter: brightness(calc(var(--pointer-from-center) * 0.3 + 0.55)) contrast(2) saturate(1);
      mix-blend-mode: color-dodge;
    }
    .card[data-foil="rainbow"] .card-glare {
      background-image: radial-gradient(
        farthest-corner circle at var(--pointer-x) var(--pointer-y),
        hsl(0, 0%, 80%), hsla(187, 10%, 85%, 0.25) 30%, hsl(197, 6%, 25%) 120%
      );
      filter: brightness(0.9) contrast(1.75);
      opacity: calc(var(--pointer-from-center) * 0.9);
      mix-blend-mode: hard-light;
    }

    /* Cosmos preset */
    .card[data-foil="cosmos"] { --card-glow: hsl(260, 90%, 78%); }
    .card[data-foil="cosmos"] .card-shine {
      background-image:
        radial-gradient(1.2px 1.2px at 12% 18%, #fff, transparent),
        radial-gradient(1px 1px at 38% 62%, #dff, transparent),
        radial-gradient(1.4px 1.4px at 72% 28%, #ffe, transparent),
        radial-gradient(1px 1px at 88% 74%, #fff, transparent),
        radial-gradient(1px 1px at 55% 45%, #cdf, transparent),
        repeating-linear-gradient(
          82deg,
          hsl(53, 65%, 60%) calc(var(--space) * 1),
          hsl(93, 56%, 50%) calc(var(--space) * 2),
          hsl(176, 54%, 49%) calc(var(--space) * 3),
          hsl(228, 59%, 55%) calc(var(--space) * 4),
          hsl(283, 60%, 55%) calc(var(--space) * 5),
          hsl(326, 59%, 51%) calc(var(--space) * 6),
          hsl(326, 59%, 51%) calc(var(--space) * 7),
          hsl(283, 60%, 55%) calc(var(--space) * 8),
          hsl(228, 59%, 55%) calc(var(--space) * 9),
          hsl(176, 54%, 49%) calc(var(--space) * 10),
          hsl(93, 56%, 50%) calc(var(--space) * 11),
          hsl(53, 65%, 60%) calc(var(--space) * 12)
        ),
        radial-gradient(
          farthest-corner circle at var(--pointer-x) var(--pointer-y),
          hsla(180, 100%, 89%, 0.5) 5%,
          hsla(180, 14%, 57%, 0.3) 40%,
          hsl(0, 0%, 0%) 130%
        );
      background-size: 100% 100%, 100% 100%, 100% 100%, 100% 100%, 100% 100%, 400% 900%, cover;
      background-position:
        10% 20%, 40% 60%, 70% 30%, 85% 75%, 50% 50%,
        calc(10% + var(--pointer-from-left) * 80%) calc(10% + var(--pointer-from-top) * 80%),
        center;
      background-blend-mode: screen, screen, screen, screen, screen, multiply, normal;
      filter: brightness(1) contrast(1.05) saturate(0.9);
    }
    .card[data-foil="cosmos"] .card-shine::before {
      background-image:
        radial-gradient(1px 1px at 22% 40%, #fff9, transparent),
        radial-gradient(1.2px 1.2px at 66% 22%, #fff7, transparent),
        repeating-linear-gradient(
          82deg,
          hsl(53, 65%, 60%) calc(var(--space) * 1),
          hsl(176, 54%, 49%) calc(var(--space) * 3),
          hsl(283, 60%, 55%) calc(var(--space) * 5),
          hsl(53, 65%, 60%) calc(var(--space) * 7)
        );
      background-size: 100% 100%, 100% 100%, 300% 700%;
      background-position: center, center, calc(var(--pointer-from-left) * 100%) calc(var(--pointer-from-top) * 100%);
      background-blend-mode: screen, screen, lighten;
      filter: brightness(1.1) contrast(1.1);
      mix-blend-mode: color-dodge;
      opacity: 0.85;
    }
    .card[data-foil="cosmos"] .card-shine::after {
      background-image: radial-gradient(
        farthest-corner circle at var(--pointer-x) var(--pointer-y),
        hsla(0, 0%, 100%, 0.55) 0%,
        hsla(260, 80%, 80%, 0.15) 30%,
        transparent 60%
      );
      mix-blend-mode: soft-light;
      filter: none;
    }

    /* Reverse preset */
    .card[data-foil="reverse"] { --card-glow: hsl(190, 40%, 75%); }
    .card[data-foil="reverse"] .card-shine {
      background-image:
        radial-gradient(circle at var(--pointer-x) var(--pointer-y), #fff 5%, #000 50%, #fff 80%),
        linear-gradient(-45deg, #000 15%, #fff, #000 85%);
      background-blend-mode: soft-light, difference;
      background-size: 120% 120%, 200% 200%;
      background-position: center, calc(100% * var(--pointer-from-left)) calc(100% * var(--pointer-from-top));
      filter: brightness(0.58) contrast(1.55) saturate(1.05);
      opacity: calc(1.35 * var(--card-opacity) - var(--pointer-from-center) * 0.35);
    }
    .card[data-foil="reverse"] .card-shine::before,
    .card[data-foil="reverse"] .card-shine::after { display: none; }
    .card[data-foil="reverse"] .card-glare {
      opacity: var(--card-opacity);
      filter: brightness(0.7) contrast(1.5);
    }

    /* Radiant preset */
    .card[data-foil="radiant"] { --card-glow: hsl(45, 100%, 75%); }
    .card[data-foil="radiant"] .card-shine {
      background-image:
        radial-gradient(
          farthest-corner ellipse at calc(var(--pointer-from-left) * 50% + 25%) calc(var(--pointer-from-top) * 50% + 25%),
          hsl(0, 0%, 95%) 20%,
          var(--card-glow) 130%
        ),
        repeating-linear-gradient(
          45deg,
          hsl(0,0%,10%) 0%, hsl(0,0%,10%) var(--barwidth),
          hsl(0,0%,20%) calc(var(--barwidth) + 0.01%), hsl(0,0%,20%) calc(var(--barwidth) * 2),
          hsl(0,0%,35%) calc(var(--barwidth) * 2 + 0.01%), hsl(0,0%,35%) calc(var(--barwidth) * 3),
          hsl(0,0%,50%) calc(var(--barwidth) * 3 + 0.01%), hsl(0,0%,50%) calc(var(--barwidth) * 4),
          hsl(0,0%,35%) calc(var(--barwidth) * 4 + 0.01%), hsl(0,0%,35%) calc(var(--barwidth) * 5),
          hsl(0,0%,20%) calc(var(--barwidth) * 5 + 0.01%), hsl(0,0%,20%) calc(var(--barwidth) * 6),
          hsl(0,0%,10%) calc(var(--barwidth) * 6 + 0.01%), hsl(0,0%,10%) calc(var(--barwidth) * 7),
          hsl(0,0%,0%) calc(var(--barwidth) * 7 + 0.01%), hsl(0,0%,0%) calc(var(--barwidth) * 8)
        ),
        repeating-linear-gradient(
          -45deg,
          hsl(0,0%,10%) 0%, hsl(0,0%,10%) var(--barwidth),
          hsl(0,0%,25%) calc(var(--barwidth) + 0.01%), hsl(0,0%,25%) calc(var(--barwidth) * 2),
          hsl(0,0%,40%) calc(var(--barwidth) * 2 + 0.01%), hsl(0,0%,40%) calc(var(--barwidth) * 3),
          hsl(0,0%,55%) calc(var(--barwidth) * 3 + 0.01%), hsl(0,0%,55%) calc(var(--barwidth) * 4),
          hsl(0,0%,30%) calc(var(--barwidth) * 4 + 0.01%), hsl(0,0%,30%) calc(var(--barwidth) * 5),
          hsl(0,0%,10%) calc(var(--barwidth) * 5 + 0.01%), hsl(0,0%,10%) calc(var(--barwidth) * 6),
          hsl(0,0%,0%) calc(var(--barwidth) * 6 + 0.01%), hsl(0,0%,0%) calc(var(--barwidth) * 7)
        );
      background-size: cover, 210% 210%, 210% 210%;
      background-position:
        center,
        calc((var(--background-x) - 50%) * 1.5 + 50%) calc((var(--background-y) - 50%) * 1.5 + 50%),
        calc((var(--background-x) - 50%) * 1.5 + 50%) calc((var(--background-y) - 50%) * 1.5 + 50%);
      background-blend-mode: exclusion, darken, color-dodge;
      filter: brightness(0.55) contrast(2) saturate(1.7);
    }
    .card[data-foil="radiant"] .card-shine::before { display: none; }
    .card[data-foil="radiant"] .card-shine::after {
      --space: 18%;
      background-image: repeating-linear-gradient(
        55deg,
        hsl(3, 95%, 85%) calc(var(--space) * 1),
        hsl(207, 100%, 84%) calc(var(--space) * 2),
        hsl(29, 100%, 85%) calc(var(--space) * 3),
        hsl(160, 100%, 86%) calc(var(--space) * 4),
        hsl(40, 94%, 86%) calc(var(--space) * 5),
        hsl(188, 95%, 85%) calc(var(--space) * 6),
        hsl(3, 95%, 85%) calc(var(--space) * 7)
      );
      background-size: 400% 100%;
      background-position: calc((var(--background-x) - 50%) * -2.5 + 50%) calc((var(--background-y) - 50%) * -2.5 + 50%);
      filter: brightness(0.65) contrast(2.8) saturate(1.8);
      mix-blend-mode: color-dodge;
    }

    .card-edge {
      position: absolute;
      inset: 0;
      border-radius: 18px;
      pointer-events: none;
      z-index: 6;
      box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.14);
      background: linear-gradient(
        145deg,
        rgba(255, 255, 255, calc(0.18 + var(--card-opacity) * 0.2)) 0%,
        transparent 32%,
        transparent 70%,
        rgba(0, 0, 0, 0.32) 100%
      );
    }

    .card-meta {
      margin-top: 14px;
      padding: 0 2px;
    }

    .card-meta p {
      font-size: 0.84rem;
      color: var(--ink-dim);
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .empty {
      grid-column: 1 / -1;
      padding: 48px 20px;
      text-align: center;
      color: var(--ink-dim);
      display: none;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
    }
    .empty.show { display: block; }

    .viewer {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(3, 8, 12, 0.82);
      backdrop-filter: blur(18px) saturate(1.2);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.28s, visibility 0.28s;
    }
    .viewer.open { opacity: 1; visibility: visible; }

    .viewer-panel {
      width: min(920px, 100%);
      max-height: min(90vh, 880px);
      display: flex;
      flex-direction: column;
      background: linear-gradient(155deg, rgba(40, 58, 70, 0.95), rgba(10, 18, 26, 0.98));
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.16);
      transform: translateY(20px) scale(0.98);
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
      overflow: hidden;
    }
    .viewer.open .viewer-panel { transform: none; }

    .viewer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: linear-gradient(180deg, rgba(255,255,255,0.05), transparent);
    }
    .viewer-bar h3 {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 400;
    }
    .viewer-actions { display: flex; gap: 8px; }

    .icon-btn {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--ink);
      cursor: pointer;
      font-size: 1.1rem;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s, transform 0.2s;
    }
    .icon-btn:hover {
      transform: translateY(-1px);
      background: rgba(58, 216, 200, 0.15);
      border-color: rgba(58, 216, 200, 0.45);
    }

    .viewer-body {
      flex: 1;
      min-height: 0;
      overflow: auto;
      background: #04090e;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .viewer-body img {
      max-width: 100%;
      max-height: min(68vh, 700px);
      object-fit: contain;
    }
    .viewer-body video {
      width: 100%;
      max-height: min(68vh, 700px);
      background: #000;
    }
    .viewer-body iframe,
    .viewer-body .pdf-frame {
      width: 100%;
      height: min(68vh, 700px);
      border: 0;
      background: #fff;
    }
    .viewer-body .pdf-frame { background: #525659; }

    .viewer-note {
      padding: 12px 18px;
      font-size: 0.88rem;
      color: var(--ink-dim);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .footer {
      margin-top: 64px;
      padding-top: 22px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.82rem;
      color: var(--ink-dim);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes plane-in {
      from { opacity: 0; transform: scale(1.04) translateY(-10px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes card-idle {
      0%, 100% { transform: rotateX(0.8deg) rotateY(-1.1deg) scale(1); }
      50% { transform: rotateX(-0.7deg) rotateY(1.2deg) scale(1.008); }
    }
    @keyframes hero-sweep {
      0%, 100% { opacity: 0.7; transform: scale(1) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.04) rotate(8deg); }
    }

    @media (max-width: 700px) {
      .wrap { padding: 0 16px 64px; }
      .hero { padding: 40px 0 56px; min-height: 92svh; }
      .hero-plane { inset: -4% -8vw 18% -8vw; }
      .grid { grid-template-columns: repeat(2, 1fr); gap: 22px 12px; }
      .section-head { flex-direction: column; align-items: stretch; }
      .filters { width: 100%; overflow-x: auto; }
      .viewer { padding: 0; }
      .viewer-panel { max-height: 100vh; height: 100%; border: none; }
      .viewer-body iframe,
      .viewer-body .pdf-frame,
      .viewer-body video { height: 55vh; max-height: none; }
      .card-shine { --scanlines-space: 0.5px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .card { transform: none !important; animation: none !important; }
      .stage-bloom { display: none; }
    }
  </style>
</head>
<body>
  <div class="stage-light" aria-hidden="true"></div>
  <div class="stage-bloom" aria-hidden="true"></div>
  <div class="stage-vignette" aria-hidden="true"></div>
  <div class="stage-grain" aria-hidden="true"></div>
  <div class="foil-pointer" id="foilPointer" aria-hidden="true">
    <span class="foil-pointer-ring"></span>
    <span class="foil-pointer-core"></span>
    <span class="foil-pointer-spark"></span>
  </div>

  <div class="wrap">
    <header class="hero" id="top">
      <div class="hero-plane" aria-hidden="true">
        <div class="hero-plane-inner"></div>
        <div class="hero-plane-shine"></div>
      </div>

      <div class="hero-copy">
        <p class="brand">作品集</p>
        <h1>倾斜卡片，捕捉箔光</h1>
        <p>六件作品，五种镭射，鼠标移开后缓缓回正。</p>
        <div class="cta-row">
          <a class="btn" href="#works">浏览作品 <span class="arrow" aria-hidden="true">→</span></a>
        </div>
      </div>
    </header>

    <section class="section" id="works" aria-labelledby="works-title">
      <div class="section-head">
        <div class="section-title">
          <span class="eyebrow">Collection</span>
          <h2 id="works-title">作品卡册</h2>
        </div>
        <div class="filters" role="tablist" aria-label="按类型筛选">
          <button class="filter active" type="button" data-filter="all">全部</button>
          <button class="filter" type="button" data-filter="image">图片</button>
          <button class="filter" type="button" data-filter="video">视频</button>
          <button class="filter" type="button" data-filter="pdf">PDF</button>
          <button class="filter" type="button" data-filter="html">HTML</button>
        </div>
      </div>

      <div class="grid" id="grid"></div>
      <p class="empty" id="empty">在脚本 WORKS 里填入作品后，卡片会出现在这里。</p>
    </section>

    <footer class="footer">
      <span>镭射预设受 pokemon-cards-css 启发</span>
      <span>Esc 关闭预览</span>
    </footer>
  </div>

  <div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="viewerTitle" hidden>
    <div class="viewer-panel">
      <div class="viewer-bar">
        <h3 id="viewerTitle">作品</h3>
        <div class="viewer-actions">
          <a class="icon-btn" id="openExternal" href="#" target="_blank" rel="noopener" title="新窗口打开" aria-label="新窗口打开">↗</a>
          <button class="icon-btn" type="button" id="closeViewer" title="关闭" aria-label="关闭">×</button>
        </div>
      </div>
      <div class="viewer-body" id="viewerBody"></div>
      <p class="viewer-note" id="viewerNote"></p>
    </div>
  </div>

  <script>
    const FOIL_LABEL = {
      regular: "Regular",
      rainbow: "Rainbow",
      cosmos: "Cosmos",
      reverse: "Reverse",
      radiant: "Radiant",
    };

    const WORKS = [
      {
        id: "middle-earth",
        title: "中土远征：末日火山",
        desc: "桌面远征地图 · Radiant",
        type: "image",
        foil: "radiant",
        src: "./works/art-01.png",
        cover: "./works/art-01.png",
      },
      {
        id: "nils",
        title: "尼尔斯骑鹅历险记",
        desc: "人物与情节导图 · Regular",
        type: "image",
        foil: "regular",
        src: "./works/art-02.png",
        cover: "./works/art-02.png",
      },
      {
        id: "meow-master",
        title: "喵喵大师",
        desc: "AI 学习伙伴角色卡 · Rainbow",
        type: "image",
        foil: "rainbow",
        src: "./works/art-03.png",
        cover: "./works/art-03.png",
      },
      {
        id: "reel",
        title: "镜头缓推",
        desc: "可灵影像 · Cosmos",
        type: "video",
        foil: "cosmos",
        src: "./works/reel.mp4",
        cover: "./works/cover-reel.png?v=2",
      },
      {
        id: "wordpal",
        title: "词伴",
        desc: "趣味背单词 · Reverse",
        type: "html",
        foil: "reverse",
        src: "./works/wordpal.html",
        cover: "./works/cover-wordpal.png?v=2",
      },
      {
        id: "picture-book",
        title: "星辰之种",
        desc: "中土绘本 · Radiant",
        type: "pdf",
        foil: "radiant",
        src: "./works/绘本.pdf",
        cover: "./works/cover-pdf.png?v=2",
      },
    ];

    const TYPE_LABEL = { image: "图片", video: "视频", pdf: "PDF", html: "HTML" };
    const TYPE_GLYPH = { image: "Img", video: "Vid", pdf: "Pdf", html: "Html" };

    const grid = document.getElementById("grid");
    const empty = document.getElementById("empty");
    const viewer = document.getElementById("viewer");
    const viewerBody = document.getElementById("viewerBody");
    const viewerTitle = document.getElementById("viewerTitle");
    const viewerNote = document.getElementById("viewerNote");
    const openExternal = document.getElementById("openExternal");
    const root = document.documentElement;

    let filter = "all";
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    let targetMX = 0.5, targetMY = 0.38, curMX = 0.5, curMY = 0.38;

    function tickLight() {
      curMX += (targetMX - curMX) * 0.1;
      curMY += (targetMY - curMY) * 0.1;
      root.style.setProperty("--mx", `${(curMX * 100).toFixed(2)}%`);
      root.style.setProperty("--my", `${(curMY * 100).toFixed(2)}%`);
      root.style.setProperty("--mxn", curMX.toFixed(4));
      root.style.setProperty("--myn", curMY.toFixed(4));
      if (!reduceMotion) requestAnimationFrame(tickLight);
    }

    if (!reduceMotion) {
      window.addEventListener("pointermove", (e) => {
        targetMX = e.clientX / window.innerWidth;
        targetMY = e.clientY / window.innerHeight;
      }, { passive: true });
      requestAnimationFrame(tickLight);
    }

    (function initFoilCursor() {
      const fine = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
      if (!fine) return;

      const pointer = document.getElementById("foilPointer");
      document.documentElement.classList.add("foil-cursor");

      let x = window.innerWidth / 2;
      let y = window.innerHeight / 2;
      let rx = x;
      let ry = y;
      let visible = false;

      const hoverSel = "a, button, .card, .filter, .icon-btn, label, summary";

      const renderCursor = () => {
        rx += (x - rx) * (reduceMotion ? 1 : 0.22);
        ry += (y - ry) * (reduceMotion ? 1 : 0.22);
        pointer.style.transform = `translate3d(${rx - 22}px, ${ry - 22}px, 0)`;
        requestAnimationFrame(renderCursor);
      };

      window.addEventListener("pointermove", (e) => {
        if (e.pointerType && e.pointerType !== "mouse") return;
        x = e.clientX;
        y = e.clientY;
        if (!visible) {
          rx = x;
          ry = y;
          visible = true;
          pointer.classList.add("is-on");
        }
        const hit = e.target && e.target.closest ? e.target.closest(hoverSel) : null;
        pointer.classList.toggle("is-hover", Boolean(hit));
      }, { passive: true });

      window.addEventListener("pointerdown", (e) => {
        if (e.pointerType && e.pointerType !== "mouse") return;
        pointer.classList.add("is-down");
      });
      window.addEventListener("pointerup", () => pointer.classList.remove("is-down"));
      window.addEventListener("pointerleave", () => {
        visible = false;
        pointer.classList.remove("is-on", "is-hover", "is-down");
      });
      window.addEventListener("blur", () => pointer.classList.remove("is-down"));

      requestAnimationFrame(renderCursor);
    })();

    document.querySelectorAll(".btn").forEach((btn) => {
      btn.addEventListener("pointermove", (e) => {
        const r = btn.getBoundingClientRect();
        btn.style.setProperty("--bx", `${((e.clientX - r.left) / r.width) * 100}%`);
        btn.style.setProperty("--by", `${((e.clientY - r.top) / r.height) * 100}%`);
      });
    });

    document.querySelectorAll(".filter").forEach((btn) => {
      btn.addEventListener("pointermove", (e) => {
        const r = btn.getBoundingClientRect();
        btn.style.setProperty("--fx", `${((e.clientX - r.left) / r.width) * 100}%`);
        btn.style.setProperty("--fy", `${((e.clientY - r.top) / r.height) * 100}%`);
      });
    });

    function clamp(n, min, max) {
      return Math.min(max, Math.max(min, n));
    }

    function bindCardTilt(card) {
      if (reduceMotion) return;

      let px = 0.5, py = 0.5, scale = 1, foil = 0;
      let active = false, raf = 0, settleRaf = 0;

      const apply = () => {
        const percentX = px * 100;
        const percentY = py * 100;
        const bgX = 50 + (percentX - 50) * 1.35;
        const bgY = 50 + (percentY - 50) * 1.55;
        const fromCenter = clamp(
          Math.sqrt((percentY - 50) ** 2 + (percentX - 50) ** 2) / 50,
          0,
          1,
        );

        card.style.setProperty("--rx", `${((0.5 - py) * 28).toFixed(2)}deg`);
        card.style.setProperty("--ry", `${((px - 0.5) * 36).toFixed(2)}deg`);
        card.style.setProperty("--pointer-x", `${percentX.toFixed(2)}%`);
        card.style.setProperty("--pointer-y", `${percentY.toFixed(2)}%`);
        card.style.setProperty("--pointer-from-center", fromCenter.toFixed(3));
        card.style.setProperty("--pointer-from-top", py.toFixed(3));
        card.style.setProperty("--pointer-from-left", px.toFixed(3));
        card.style.setProperty("--background-x", `${bgX.toFixed(2)}%`);
        card.style.setProperty("--background-y", `${bgY.toFixed(2)}%`);
        card.style.setProperty("--card-opacity", foil.toFixed(3));
        card.style.setProperty("--sx", `${((px - 0.5) * -32).toFixed(1)}px`);
        card.style.setProperty("--sy", `${(18 + (py - 0.5) * 18 + fromCenter * 10).toFixed(1)}px`);
        card.style.setProperty("--scale", scale.toFixed(4));
        raf = 0;
      };

      const queue = () => { if (!raf) raf = requestAnimationFrame(apply); };

      const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);

      const cancelSettle = () => {
        if (settleRaf) {
          cancelAnimationFrame(settleRaf);
          settleRaf = 0;
        }
        card.classList.remove("settling");
      };

      const settle = () => {
        cancelSettle();
        card.classList.remove("active");
        card.classList.add("settling");

        const startPx = px;
        const startPy = py;
        const startScale = scale;
        const startFoil = foil;
        const duration = 780;
        const start = performance.now();

        const tick = (now) => {
          if (active) return;
          const t = clamp((now - start) / duration, 0, 1);
          const k = easeOutCubic(t);
          px = startPx + (0.5 - startPx) * k;
          py = startPy + (0.5 - startPy) * k;
          scale = startScale + (1 - startScale) * k;
          foil = startFoil * (1 - k);
          apply();
          if (t < 1) {
            settleRaf = requestAnimationFrame(tick);
          } else {
            settleRaf = 0;
            px = 0.5;
            py = 0.5;
            scale = 1;
            foil = 0;
            apply();
            card.classList.remove("settling");
          }
        };

        settleRaf = requestAnimationFrame(tick);
      };

      card.addEventListener("pointerenter", () => {
        active = true;
        cancelSettle();
        card.classList.add("active");
        scale = 1.04;
        foil = Math.max(foil, 0.4);
        queue();
      });

      card.addEventListener("pointerleave", () => {
        active = false;
        settle();
      });

      card.addEventListener("pointermove", (e) => {
        const r = card.getBoundingClientRect();
        px = clamp((e.clientX - r.left) / r.width, 0, 1);
        py = clamp((e.clientY - r.top) / r.height, 0, 1);
        const fromCenter = clamp(
          Math.hypot(px - 0.5, py - 0.5) * 2,
          0,
          1,
        );
        foil = clamp(0.35 + fromCenter * 0.75, 0, 1);
        scale = 1.04;
        queue();
      });
    }

    function el(tag, className) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      return node;
    }

    function buildCard(work) {
      const slot = el("div", "card-slot");
      const foil = work.foil || "regular";

      const card = el("button", "card");
      card.type = "button";
      card.dataset.foil = foil;
      card.dataset.type = work.type || "";
      card.setAttribute("aria-label", `查看 ${work.title}`);

      const face = el("div", "card-face");
      const bezel = el("div", "card-bezel");

      const head = el("div", "card-head");
      const type = el("span", "card-type");
      type.textContent = TYPE_LABEL[work.type] || work.type;
      const foilTag = el("span", "card-foil-tag");
      foilTag.textContent = FOIL_LABEL[foil] || foil;
      head.append(type, foilTag);

      const art = el("div", "card-art");
      if (work.art) art.style.setProperty("--art", work.art);
      if (work.cover || (work.type === "image" && work.src)) {
        const img = document.createElement("img");
        img.src = work.cover || work.src;
        img.alt = "";
        img.loading = "lazy";
        art.appendChild(img);
      } else {
        const g = el("div", "glyph");
        g.textContent = TYPE_GLYPH[work.type] || "?";
        art.appendChild(g);
      }

      const plate = el("div", "card-plate");
      const title = document.createElement("h3");
      title.textContent = work.title;
      const sub = el("span", "sub");
      sub.textContent = FOIL_LABEL[foil] || work.desc || "";
      plate.append(title, sub);

      face.append(bezel, head, art, plate, el("div", "card-shine"), el("div", "card-glare"), el("div", "card-edge"));
      card.appendChild(face);

      const meta = el("div", "card-meta");
      const p = document.createElement("p");
      p.textContent = work.desc || "";
      meta.appendChild(p);
      slot.append(card, meta);

      card.addEventListener("click", () => openViewer(work));
      bindCardTilt(card);

      return slot;
    }

    function render() {
      const list = filter === "all" ? WORKS : WORKS.filter((w) => w.type === filter);
      grid.innerHTML = "";
      empty.classList.toggle("show", list.length === 0);

      list.forEach((work, i) => {
        const slot = buildCard(work);
        slot.style.animationDelay = `${Math.min(i * 0.05, 0.35)}s`;
        grid.appendChild(slot);
      });
    }

    function openViewer(work) {
      viewerTitle.textContent = work.title;
      viewerNote.textContent = work.desc || `${TYPE_LABEL[work.type] || ""} · ${FOIL_LABEL[work.foil] || ""}`;
      openExternal.href = work.src || "#";
      openExternal.style.display = work.src ? "" : "none";
      viewerBody.innerHTML = "";

      if (!work.src) {
        const tip = document.createElement("p");
        tip.style.cssText = "color:#8aa4ae;padding:48px 24px;text-align:center;max-width:36ch;";
        tip.textContent = "在 WORKS 里为这条作品填写 src 后，这里会显示内容。";
        viewerBody.appendChild(tip);
      } else if (work.type === "image") {
        const img = document.createElement("img");
        img.src = work.src;
        img.alt = work.title;
        viewerBody.appendChild(img);
      } else if (work.type === "video") {
        const video = document.createElement("video");
        video.src = work.src;
        video.controls = true;
        video.autoplay = true;
        video.playsInline = true;
        viewerBody.appendChild(video);
      } else if (work.type === "pdf") {
        const iframe = document.createElement("iframe");
        iframe.className = "pdf-frame";
        iframe.src = work.src;
        iframe.title = work.title;
        viewerBody.appendChild(iframe);
      } else if (work.type === "html") {
        const iframe = document.createElement("iframe");
        iframe.src = work.src;
        iframe.title = work.title;
        iframe.sandbox = "allow-scripts allow-same-origin allow-forms allow-popups";
        viewerBody.appendChild(iframe);
      }

      viewer.hidden = false;
      requestAnimationFrame(() => viewer.classList.add("open"));
      document.body.style.overflow = "hidden";
      document.getElementById("closeViewer").focus();
    }

    function closeViewer() {
      viewer.classList.remove("open");
      document.body.style.overflow = "";
      const video = viewerBody.querySelector("video");
      if (video) video.pause();
      setTimeout(() => {
        if (!viewer.classList.contains("open")) {
          viewer.hidden = true;
          viewerBody.innerHTML = "";
        }
      }, 280);
    }

    document.querySelectorAll(".filter").forEach((elBtn) => {
      elBtn.addEventListener("click", () => {
        document.querySelectorAll(".filter").forEach((f) => f.classList.remove("active"));
        elBtn.classList.add("active");
        filter = elBtn.dataset.filter;
        render();
      });
    });

    document.getElementById("closeViewer").addEventListener("click", closeViewer);
    viewer.addEventListener("click", (e) => { if (e.target === viewer) closeViewer(); });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && viewer.classList.contains("open")) closeViewer();
    });

    render();
  </script>
</body>
</html>
